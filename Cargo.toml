[workspace]
resolver = "3"
members = [
    "Engine/Source/Runtime/yolo-engine-core",
    "Engine/Source/Runtime/yolo-engine-render",
    "Engine/Source/Runtime/yolo-engine-online",
    "Engine/Source/Editor/yolo-engine-editor",
    "crates/*",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["Antigravity & YOLO Protocol Contributors <contact@aphrody.com>"]

[workspace.dependencies]
bevy = { version = "0.15", default-features = false }
wgpu = { version = "30.0.1" }
tokio = { version = "1.52.1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
