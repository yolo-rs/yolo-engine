[workspace]
resolver = "2"
members = [
    "Engine/Source/Runtime/yolo-engine-core",
    "Engine/Source/Runtime/yolo-engine-render",
    "Engine/Source/Runtime/yolo-engine-online",
    "Engine/Source/Editor/yolo-engine-editor",
]

[workspace.package]
version = "6.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Antigravity & YOLO Protocol Contributors <contact@aphrody.com>"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
