; =============================================================================
; YOLO Engine 6.0 (UE6) — DefaultEngine.ini
; Strict Unreal Engine 6 Configuration Hierarchy in Rust 2024 & Bun 1.4.4+
; =============================================================================

[/Script/EngineSettings.GameMapsSettings]
EditorStartupMap=/Engine/Maps/Templates/OpenWorld_Lumen_Nanite
GameDefaultMap=/Engine/Maps/Templates/OpenWorld_Lumen_Nanite
GlobalDefaultGameMode=/Script/Engine.GameModeBase

[/Script/Engine.RendererSettings]
r.Mobile.ShadingPath=0
r.AllowStaticLighting=False
r.DynamicGlobalIlluminationMethod=1 ; Lumen Software + Hardware RayTracing via WGPU/Dawn
r.ReflectionMethod=1 ; Lumen Reflections
r.Shadow.Virtual.Enable=1 ; Virtual Shadow Maps (VSM)
r.Nanite=1 ; Nanite Cluster-Driven Compute Meshlet Pipeline (WGSL)
r.Nanite.MaxNodes=2097152
r.TemporalAA.Upscaler=1 ; TSR (Temporal Super Resolution) Compute Shader
r.ShaderDevelopmentMode=1
r.ShaderCompiler.Backend=NagaWGSL_SPIRV_DXIL_MSL

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_WGPU_DX12
TargetedRHIs=PCD3D_SM6
TargetedRHIs=VULKAN_SM6
TargetedRHIs=METAL_SM6
TargetedRHIs=WEBGPU

[/Script/UnrealEd.EditorExperimentalSettings]
bEnableVerseScripting=True
bEnableZedGpuiDocking=True
bEnableHelixModalKeymap=True
bEnableArtcraftViewportSculpting=True
bEnableTreeSitterLiveGraphify=True
bEnableMcpLiveControl=True

[/Script/OnlineSubsystemEOS.EOSSettings]
CacheDir=CacheDir
DefaultArtifactName=YoloEngine6
TickBudgetInMilliseconds=1
bEnableOverlay=True
bEnableSocialOverlay=True
bUseEAS=True
bUseEOSConnect=True
bUseR2CpkStreaming=True
